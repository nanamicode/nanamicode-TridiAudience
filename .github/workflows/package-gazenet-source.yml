name: package-gazenet-source

on:
  push:
    branches:
      - work/gazenet-v1.22.2-polished
    paths:
      - ".github/workflows/package-gazenet-source.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record source commit
        run: |
          set -euxo pipefail
          mkdir -p source-meta
          printf '%s\n' "$GITHUB_SHA" > source-meta/BUILD_COMMIT.txt
          printf '%s\n' "work/gazenet-v1.22.2-polished" > source-meta/BRANCH.txt
      - name: Upload source patch
        uses: actions/upload-artifact@v4
        with:
          name: TridiAudience-v1.22.2-POLISHED-GAZENET-RADAR3D-SOURCE-PATCH
          path: |
            native/**
            app/src/main/java/com/tridi/audience/CameraController.java
            app/src/main/java/com/tridi/audience/MainActivity.java
            scripts/**
            .github/workflows/convert-gaze-models.yml
            .github/workflows/build-polished-core.yml
            .github/workflows/package-gazenet-source.yml
            README.md
            source-meta/**
          retention-days: 30

